<div class="container">
    <div class="fake-phone">
        <div class="messaging-container">
            <div class="message-list">
                <!-- Goal 3: Display messages using TextMessageComponent -->
                <ng-container *ngFor="let message of viewModel.messages$ | async">
                    <app-text-message *ngIf="viewModel.isTextMessage(message)" [message]="message"></app-text-message>
                </ng-container>
            </div>
        </div>
    </div>
</div>
